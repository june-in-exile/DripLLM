services:
  facilitator:
    image: node:22-alpine
    working_dir: /app
    # Install dependencies inside the container: if the host's node_modules (macOS) contains native bindings,
    # mounting it straight into alpine breaks, so an anonymous volume masks it.
    command: sh -c "npm ci && npm run facilitator"
    ports:
      - "8080:8080"
    environment:
      FACILITATOR_URL: http://facilitator:8080
      FACILITATOR_PORT: 8080
      FACILITATOR_PRIVATE_KEY: ${FACILITATOR_PRIVATE_KEY}
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY}
      LLM_PROVIDER_ADDRESS: ${LLM_PROVIDER_ADDRESS}
      FUJI_RPC_URL: ${FUJI_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      FACILITATOR_POLLING_MS: ${FACILITATOR_POLLING_MS:-250}
    volumes:
      - .:/app
      - /app/node_modules
